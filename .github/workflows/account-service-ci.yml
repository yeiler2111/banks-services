# CI de account-service: compila y ejecuta TODOS los tests en cada push / pull request.
#
# Monorepo: solo se dispara si cambia algo de account-service (o este mismo workflow).
# Cada microservicio tendrá su propio workflow con su propio filtro de rutas.

name: account-service CI

on:
  push:
    branches: [main, master]
    paths:
      - "account-service/**"
      - ".github/workflows/account-service-ci.yml"
  pull_request:
    paths:
      - "account-service/**"
      - ".github/workflows/account-service-ci.yml"
  workflow_dispatch: # botón "Run workflow" para lanzarlo a mano desde GitHub

# Si llegan dos pushes seguidos a la misma rama, cancela la ejecución anterior
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Mínimo privilegio: el pipeline solo necesita leer el código
permissions:
  contents: read

jobs:
  test:
    name: Build & Test
    runs-on: ubuntu-latest
    timeout-minutes: 15

    defaults:
      run:
        working-directory: account-service

    # PostgreSQL desechable para los tests que levantan Spring completo
    # (AccountServiceApplicationTests: Flyway + Hibernate validate contra una BD real).
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: accounts_db
          POSTGRES_USER: nexus
          POSTGRES_PASSWORD: nexus123
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U nexus -d accounts_db"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      SPRING_DATASOURCE_URL: jdbc:postgresql://localhost:5432/accounts_db
      SPRING_DATASOURCE_USERNAME: nexus
      SPRING_DATASOURCE_PASSWORD: nexus123

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven # cachea ~/.m2 entre ejecuciones (clave = hash de los pom.xml)

      # En Windows git a veces no guarda el permiso de ejecución del wrapper
      - name: Make Maven wrapper executable
        run: chmod +x mvnw

      # verify = compilar + tests unitarios + tests de integración + empaquetar
      - name: Build & run tests
        run: ./mvnw -B -ntp verify

      # Si algo falla, sube los reportes para poder ver qué test rompió
      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: account-service-test-reports
          path: account-service/target/surefire-reports/
          retention-days: 7
